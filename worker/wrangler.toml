name = "photo-admin"
main = "src/index.ts"
compatibility_date = "2024-05-29"

# R2 存储绑定
[[r2_buckets]]
binding = "PHOTOS_BUCKET"
bucket_name = "hyonelin-gallery"

# KV 存储绑定（用于限流）
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "your-kv-namespace-id"

# 环境变量（敏感信息，不要提交到 git）
[vars]
# ADMIN_PASSWORD, R2_BASE_URL, TURNSTILE_SECRET 将在 Cloudflare Dashboard 中设置

# 开发环境配置
[dev]
port = 8787
local_protocol = "http"
